name: Polyglot SDK consumer matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 3 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@df3eed96202810b7e7d6667fabc3041b19e6a22f
    with:
      clients_repository: sonus-auris/sonus-auris-clients
      clients_ref: main
      clients_root: clients
      interfaces_repository: sonus-auris/sonus-auris-interfaces
      interfaces_ref: main
      interfaces_path: sonus-auris-interfaces
      interfaces_dependency: sonus-auris/sonus-auris-interfaces
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}
