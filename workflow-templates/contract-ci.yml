name: Independent contract CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Require an executable product contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x scripts/run-contract.sh ]]; then
            echo 'harness_regression: scripts/run-contract.sh is required; metadata-only success is prohibited.' >&2
            exit 1
          fi
      - name: Execute deterministic product contract
        run: scripts/run-contract.sh
